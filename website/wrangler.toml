name = "army-website"
account_id = "eb4ad8fa494badb4359e91aa85ebf768"
main = "dist/_worker.js/index.js"
compatibility_date = "2026-02-17"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "agent-vera.com", custom_domain = true },
  { pattern = "www.agent-vera.com", custom_domain = true },
]

[assets]
binding = "ASSETS"
directory = "./dist"

[[services]]
binding = "CONTROL_PLANE"
service = "army-control-plane"

[vars]
API_BASE_URL = "https://army-control-plane.stepandel.workers.dev"
SHOW_BYOK = "false"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1