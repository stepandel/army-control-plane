name = "army-control-plane"
account_id = "eb4ad8fa494badb4359e91aa85ebf768"
main = "src/index.ts"
compatibility_date = "2026-02-17"
compatibility_flags = ["nodejs_compat"]

# routes = [{ pattern = "api.army.ai", custom_domain = true }]

[[kv_namespaces]]
binding = "ROUTING_TABLE"
id = "aa0a6fbff64147bc95814a4491cb1725"
preview_id = "b89b8349fe6646689993a8044be48966"

[[kv_namespaces]]
binding = "OAUTH_STATE"
id = "bb010975d56049d28fb61a1b3d627950"
preview_id = "1dea428553cf47e181da9ac16ce1351f"

# Ops alert dedupe + health-check bookkeeping.
#
# TODO(ops): create the namespace and uncomment the binding below to re-enable
# alert dedupe. While this is commented out, sendAlert() and the health-check
# cron will still send alerts — they just won't suppress repeats. The runtime
# code paths are guarded with `if (!env.ALERT_STATE)` no-ops, so the binding
# is safe to add or remove without code changes.
#
#   cd workers/control-plane
#   wrangler kv namespace create ALERT_STATE
#   wrangler kv namespace create ALERT_STATE --preview
#   # paste the returned ids below, then uncomment the [[kv_namespaces]] block
#
# [[kv_namespaces]]
# binding = "ALERT_STATE"
# id = "<paste production id>"
# preview_id = "<paste preview id>"

[[hyperdrive]]
binding = "DB"
id = "3ef1724bda9a4da1b96d080e65d8b0b2"

[vars]
FLY_APP = "vera-images"
FLY_ORG = "vera-ai"
BASE_URL = "https://army-control-plane.stepandel.workers.dev"
GITHUB_APP_SLUG = "agent-vera"
GITHUB_APP_ID="3061325"
WEBSITE_URL = "https://army-website.stepandel.workers.dev"
LANGSMITH_TRACING = "true"
LANGSMITH_PROJECT = "anton-remote"
LANGFUSE_PUBLIC_KEY = "pk-lf-8bf97bf2-34de-4532-91d4-724ab7f38feb"
LANGFUSE_BASE_URL = "https://us.cloud.langfuse.com"

[triggers]
# Dispatched by `event.cron` in src/index.ts scheduled handler.
#   */30 * * * *  — Linear token refresh + expired-trial enforcement
#   */5  * * * *  — tenant fleet health checks (Fly machine state + token-refresh symptom)
crons = ["*/30 * * * *", "*/5 * * * *"]

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
