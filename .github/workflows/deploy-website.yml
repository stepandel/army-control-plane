name: Deploy Website

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (tag, branch, or commit SHA)"
        required: true
        default: "main"

concurrency:
  group: deploy-website-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      WEBSITE_DEPLOY_REF: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event.inputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.WEBSITE_DEPLOY_REF }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @army/website build
      - run: pnpm --filter @army/website run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Summarize deploy
        run: |
          echo "## Website deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Ref: \`$WEBSITE_DEPLOY_REF\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Trigger: \`${{ github.event_name }}\`" >> "$GITHUB_STEP_SUMMARY"
